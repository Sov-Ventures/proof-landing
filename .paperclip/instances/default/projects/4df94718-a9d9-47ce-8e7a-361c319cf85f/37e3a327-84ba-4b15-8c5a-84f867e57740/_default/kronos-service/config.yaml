# Kronos Forecast Service Configuration
# ──────────────────────────────────────

server:
  host: "0.0.0.0"
  port: 8777

model:
  name: "NeoQuasar/Kronos-small"        # 24.7M params, CPU-friendly
  tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  device: "cpu"                          # "cpu" or "cuda:0"
  max_context: 512

forecast:
  default_sample_count: 50
  cache_ttl_seconds: 300                 # 5 minutes

# Per-strategy recommended settings:
# ──────────────────────────────────
# BS IV Arb:     timeframe=1h, pred_len=24, temp=0.8  (vol forecast replaces static IV)
# Pair Trading:  timeframe=4h, pred_len=12, temp=1.0  (regime filter for mean-reversion)
# MoE/Alloc:     timeframe=1d, pred_len=7,  temp=1.0  (forward-looking regime weighting)
# Certainty:     timeframe=5m, pred_len=3,  temp=0.5  (low temp for high-confidence)
# FLB (BTC/ETH/SOL): timeframe=1d, pred_len=3, temp=1.0  (directional filter + vol sizing)
# BTC Weekly:    timeframe=1d, pred_len=7,  temp=1.0  (pattern confirmation)
# Market Maker:  timeframe=1h, pred_len=6,  temp=0.8  (vol-aware spread adjustment)
